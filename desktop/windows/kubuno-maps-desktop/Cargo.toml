[package]
name        = "kubuno-maps-desktop"
description = "Kubuno Maps for Windows (kubuno-maps.exe): the Win32 window of the map (the navigation toolbar, the search bar, the layers panel and the native map surface drawn with the framework's Graphics), and the entry point that registers the Windows platform and runs the app of desktop/common"
version.workspace = true
edition.workspace = true
license.workspace = true

# The library holds everything the Visual Studio designer must link to render the views (the main window and the
# custom map-surface control). The binary is the short `Program.cs` (`main.rs`): it registers the Windows
# platform and runs the app of desktop/common.
[lib]
name = "kubuno_maps_desktop"
path = "src/lib.rs"

[[bin]]
name = "kubuno-maps"
path = "src/main.rs"

[dependencies]
# The portable app: launch options, map view state, sample data, platform extension points.
kubuno-maps-desktop-common.workspace = true
# The map engine (common/core).
kubuno-maps-core.workspace = true
# The Kubuno desktop programming model (Application::run, #[kubuno_desktop::view], custom controls, resources).
# Written `= { workspace = true }`: the views macros read this manifest to find the facade.
kubuno-desktop = { workspace = true }
# Logging of the failed server calls (search, saved places).
tracing.workspace = true

[dependencies.windows]
version  = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-manifest = "1.4"
