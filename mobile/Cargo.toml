# Kubuno Maps - the mobile app. ONE Cargo workspace for every mobile OS, laid out like the desktop app
# (../desktop) and independent of the module server's (../server/Cargo.toml):
#
#   common/   the complete app, portable: the .kbview screens (edited in Visual Studio) and the interactive themed
#             MapView host control, rendered by the shared Kubuno mobile renderer.
#   android/  only what Android does differently: the APK entry point (package `com.kubuno.maps`, launcher icon)
#             handing the app to the shared Android shell. Built with cargo-apk on a machine with the Android
#             SDK/NDK (the .142 verification box, CI).
#   ios/      only what iOS does differently: the entry point handing the app to the shared iOS shell. Built and
#             packaged into a .app on a Mac.
#
# The renderer and the Android / iOS shells are the core repository's (core/mobile), shared by every module's
# mobile app; this repository holds the Maps app only. The map maths come from the module's shared engine
# (../common/core, kubuno-maps-core), the same crate the desktop app and the web use.
[workspace]
resolver = "2"
members  = [
    "common/kubuno-maps-mobile-common",
    "android/kubuno-maps-mobile-android",
    "ios/kubuno-maps-mobile-ios",
]

[workspace.package]
version    = "0.1.0"   # Kubuno Maps mobile's own version
edition    = "2021"
license    = "AGPL-3.0-or-later"
repository = "https://github.com/kubuno/maps"

[workspace.dependencies]
# The portable app.
kubuno-maps-mobile-common = { path = "common/kubuno-maps-mobile-common" }
# The map engine every Kubuno Maps client shares.
kubuno-maps-core          = { path = "../common/core" }

# The shared mobile renderer and shells (core repository, core/mobile). Referenced from the sibling core checkout
# until core publishes a mobile tag; then they move to `git = "https://github.com/kubuno/core", tag = "…"` like the
# desktop framework. The shells are libraries here (`default-features = false`): this app provides its own entry
# points instead of the shells' standalone demo.
kubuno-mobile-render        = { path = "../../core/mobile/common/kubuno-mobile-render" }
# The account / network base and the shared sign-in screens (core/mobile/common).
kubuno-mobile-account       = { path = "../../core/mobile/common/kubuno-mobile-account" }
kubuno-mobile-signin        = { path = "../../core/mobile/common/kubuno-mobile-signin" }
kubuno-mobile-shell-android = { path = "../../core/mobile/android/kubuno-mobile-shell-android", default-features = false }
kubuno-mobile-shell-ios     = { path = "../../core/mobile/ios/kubuno-mobile-shell-ios", default-features = false }

# Same versions/features as the core mobile workspace (core/mobile/Cargo.toml), so the types match.
android-activity = { version = "0.6", features = ["native-activity"] }
tiny-skia        = { version = "0.11", default-features = false, features = ["std", "simd"] }

# The views are rasterised on the CPU: keep it fast even in debug builds (cargo-apk builds the dev profile).
[profile.dev.package."*"]
opt-level = 2
